<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QA Taskboard</title>
    <style>
      body { background: #f5f7fb; color: #172033; font-family: Arial, sans-serif; margin: 0; }
      main { background: white; border-radius: 12px; box-shadow: 0 8px 30px #14213d1a; margin: 64px auto; max-width: 680px; padding: 32px; }
      h1 { margin-top: 0; } form { display: flex; gap: 8px; } input { border: 1px solid #9ca8ba; border-radius: 6px; flex: 1; font-size: 16px; padding: 10px; }
      button { background: #245a98; border: 0; border-radius: 6px; color: white; cursor: pointer; padding: 10px 14px; }
      input:focus-visible, button:focus-visible { outline: 3px solid #f5a623; outline-offset: 2px; }
      li { align-items: center; border-bottom: 1px solid #e6eaf0; display: flex; gap: 12px; padding: 13px 0; }
      .completed { color: #667085; text-decoration: line-through; } .error { color: #b42318; min-height: 20px; }
      .sr-only { height: 1px; margin: -1px; overflow: hidden; padding: 0; position: absolute; width: 1px; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>Release Taskboard</h1>
      <p>Small demo app used only for independent QA portfolio testing.</p>
      <form data-testid="task-form">
        <label for="new-task" class="sr-only">New task</label>
        <input id="new-task" data-testid="new-task-input" placeholder="Add a release task" required />
        <button type="submit">Add task</button>
      </form>
      <p data-testid="error-message" class="error" role="alert"></p>
      <ul data-testid="task-list"></ul>
    </main>
    <script>
      const list = document.querySelector('[data-testid="task-list"]');
      const form = document.querySelector('[data-testid="task-form"]');
      const input = document.querySelector('[data-testid="new-task-input"]');
      const error = document.querySelector('[data-testid="error-message"]');
      const request = (path, options) => fetch(path, { headers: { 'content-type': 'application/json' }, ...options });
      async function render() {
        const { tasks } = await (await request('/api/tasks')).json();
        list.replaceChildren(...tasks.map((task) => {
          const item = document.createElement('li'); item.dataset.testid = `task-${task.id}`;
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = task.completed;
          checkbox.setAttribute('aria-label', `Mark ${task.title} complete`);
          checkbox.addEventListener('change', async () => { await request(`/api/tasks/${task.id}`, { method: 'PATCH', body: JSON.stringify({ completed: checkbox.checked }) }); render(); });
          const title = document.createElement('span'); title.textContent = task.title; if (task.completed) title.className = 'completed';
          item.append(checkbox, title); return item;
        }));
      }
      form.addEventListener('submit', async (event) => {
        event.preventDefault(); error.textContent = '';
        const response = await request('/api/tasks', { method: 'POST', body: JSON.stringify({ title: input.value }) });
        if (!response.ok) { error.textContent = 'A task title is required.'; return; }
        input.value = ''; await render();
      });
      render();
    </script>
  </body>
</html>
