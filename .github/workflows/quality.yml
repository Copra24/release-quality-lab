name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: Cross-browser UI and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:runtime
      - run: npm run validate:assets
      - run: npm run validate:openapi
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  api-performance-smoke:
    name: API performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start demo API
        run: |
          node demo-app/server.js > demo-app.log 2>&1 &
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:4173/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat demo-app.log
          exit 1
      - run: npm run test:performance
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-performance-smoke
          path: artifacts/api-performance-smoke.json
          retention-days: 14
