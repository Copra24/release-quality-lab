name: Sauce Labs Android Smoke

on:
  workflow_dispatch:
    inputs:
      sauce_region:
        description: Sauce Labs region used when the account was created
        required: true
        default: us-west-1
        type: choice
        options: [us-west-1, eu-central-1]
      capture_page_source:
        description: Save the launch-screen Android page source as a workflow artifact for locator design
        required: true
        default: false
        type: boolean
      diagnostic_open_first_product:
        description: Open the first catalog product and save its page source for native-flow locator design
        required: true
        default: false
        type: boolean
      scenario:
        description: Android test flow to run
        required: true
        default: launch
        type: choice
        options: [launch, cart, checkout-diagnostic, checkout-login-diagnostic]

jobs:
  android-smoke:
    name: Appium Android smoke on Sauce Labs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sauce-labs
    env:
      MOBILE_GRID: sauce
      SAUCE_REGION: ${{ inputs.sauce_region }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_APP: ${{ secrets.SAUCE_APP }}
      ANDROID_APP_PACKAGE: ${{ vars.ANDROID_APP_PACKAGE }}
      ANDROID_APP_ACTIVITY: ${{ vars.ANDROID_APP_ACTIVITY }}
      SMOKE_ACCESSIBILITY_ID: ${{ vars.SMOKE_ACCESSIBILITY_ID }}
      SMOKE_EXPECTED_TEXT: Sauce Labs Backpack
      ANDROID_DEVICE_NAME: ${{ vars.ANDROID_DEVICE_NAME || 'Samsung Galaxy S23 FE' }}
      ANDROID_PLATFORM_VERSION: ${{ vars.ANDROID_PLATFORM_VERSION || '16' }}
      MOBILE_CAPTURE_PAGE_SOURCE: ${{ inputs.capture_page_source }}
      MOBILE_DIAGNOSTIC_OPEN_FIRST_PRODUCT: ${{ inputs.diagnostic_open_first_product }}
      MOBILE_TEST_SCENARIO: ${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:android
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.capture_page_source }}
        with:
          name: android-page-source
          path: artifacts/*.xml
          retention-days: 14
